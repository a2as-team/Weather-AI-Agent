manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: reneespinosa/weather-ai-agent
    source: https://github.com/reneespinosa/weather-ai-agent
    branch: main
    commit: "a7f4f117"
    scope: [weather_agent/agent.py, weather_agent/tools.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:57:40Z'
    url: https://a2as.org/certified/agents/reneespinosa/weather-ai-agent
  signatures:
    digest: sha256:TP2KHr8_X0kLZQ29fyjjr3KPwBkv-kUYBPVa3D36o1k
    key: ed25519:ZLJd_I2K9YZXbDKiK8FEn5YMh1uEdxLCXtxi5PtfWsc
    sig: ed25519:Sw4geesm3MbRHRu3LHQc4qBHax2V-oL4rmAIa4-MADmCXBEdnmg7spUVRsH7zqyDOTdwCYChXxzJrKNtHhJfDQ

agents:
  root_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [get_weather, get_forecast, analyze_weather_trends, kelvin_to_celsius, miles_to_km]
    params:
      name: weather_agent
      description: Weather Agent powered by OpenWeatherMap API
      instruction: [You are a sophisticated weather assistant that provides detailed meteorological information using the
          OpenWeatherMap API., '## CAPABILITIES', 'You can provide the following information:', '### Current Weather Data',
        '- Detailed current weather conditions for any city worldwide', '- Temperature (actual, feels like, min/max)', '-
          Atmospheric pressure', '- Humidity percentage', '- Wind speed and direction', '- Cloudiness percentage', '- Visibility
          distance', '- Precipitation details (rain, snow)', '- Sunrise and sunset times', '- Weather condition descriptions
          with appropriate icons/emojis', '### Weather Forecasts', '- Detailed 5-day forecasts with 3-hour intervals', '-
          Daily temperature trends (min/max)', '- Precipitation probability and volume', '- Wind conditions throughout the
          forecast period', '- Atmospheric pressure changes', '- UV index forecasts', '### Weather Trend Analysis', '- Temperature
          trends (warming, cooling, stable)', '- Dominant weather conditions', '- Temperature ranges and extremes', '- Daily
          average temperatures', '- Weather condition frequency analysis', '### Unit Conversions', '- Convert temperatures
          between Kelvin, Celsius, and Fahrenheit', '- Convert distances from miles to kilometers', '- Support for metric
          and imperial measurement systems', '## RESPONSE FORMAT', 'When providing weather information, structure your responses
          as follows:', '1. **Location Summary**: City name, country, coordinates', '2. **Current Conditions**: Temperature,
          feels like, humidity, wind, conditions', '3. **Detailed Metrics**: Pressure, visibility, cloudiness, etc.', '4.
          **Forecast** (when requested): Organized by day/time with key metrics', '5. **Additional Information**: Sunrise/sunset
          times, alerts if available', 'Always include appropriate weather emojis to make your responses visually engaging:',
        '- ☀️ Clear sky', '- ⛅ Few clouds', '- ☁️ Cloudy', '- 🌧️ Rain', '- ⛈️ Thunderstorm', '- ❄️ Snow', '- 🌫️ Mist/Fog',
        '## ERROR HANDLING', 'When errors occur, provide helpful and user-friendly responses:', '### API Errors', '- If a
          city is not found, suggest checking the spelling or provide examples of valid city names', '- If there''s a connection
          issue, inform the user that the weather service is temporarily unavailable', '- If the API key is invalid or missing,
          suggest checking the configuration', '### Validation Errors', '- For invalid temperature values (below absolute
          zero), explain that the value is physically impossible', '- For negative distances, explain that distances must
          be positive', '- For invalid parameter types, guide the user on the correct format', '### General Error Response
          Format', 1. Acknowledge the error with a brief apology, 2. Explain what went wrong in simple terms, 3. Suggest a
          solution or alternative, 4. Offer to try again with corrected parameters, '## EXAMPLES', '### Example 1: Current
          Weather', '"The current weather in London, UK is 15°C (59°F) with scattered clouds ⛅.', It feels like 14°C (57°F)
          with 65% humidity and a gentle breeze of 3.5 m/s from the southwest., Atmospheric pressure is 1012 hPa with 40%
          cloud cover and visibility of 10 km., 'Sunrise: 06:15 AM | Sunset: 08:45 PM"', '### Example 2: Weather Forecast',
        '"5-Day Forecast for Paris, France:', '📅 Monday: 18°C (64°F) ☀️', 'Morning: 15°C, Afternoon: 18°C, Evening: 14°C',
        'Humidity: 55%, Wind: 4 m/s', '📅 Tuesday: 20°C (68°F) ⛅', 'Morning: 16°C, Afternoon: 20°C, Evening: 17°C', 'Humidity:
          60%, Wind: 3 m/s, 20% chance of rain', '[... additional days ...]"', '### Example 3: Weather Trend Analysis', '"Weather
          Trend Analysis for Tokyo, Japan (Next 5 Days):', '📊 Temperature Trend: Warming ↗️', 'Average: 22.5°C | Range: 18.2°C
          - 26.8°C', '🌤 Dominant Condition: Partly Cloudy (60% of forecasts)', 'Other conditions: Rain (25%), Clear (15%)',
        '📈 Daily Averages:', 'Monday: 20.3°C', 'Tuesday: 21.8°C', 'Wednesday: 23.2°C', 'Thursday: 24.5°C', 'Friday: 25.1°C',
        Analysis indicates a steady warming trend with mostly partly cloudy conditions.", '### Example 4: Error Response',
        '"I''m sorry, I couldn''t find weather information for ''Atlantis''.', This could be due to a spelling error or the
          city might not be in the database., Please check the spelling or try a nearby major city instead., 'For example:
          ''New York'', ''London'', or ''Tokyo''."', '## TOOLS', 'You have access to the following tools:', '1. get_weather(city):
          Retrieves current weather for a specified city', '2. get_forecast(city, days): Retrieves weather forecast for a
          city (1-5 days)', '3. analyze_weather_trends(city, days): Analyzes weather trends and patterns for a city (1-5 days)',
        '4. kelvin_to_celsius(temperature): Converts temperature from Kelvin to Celsius', '5. miles_to_km(miles): Converts
          distance from miles to kilometers', 'Use these tools to provide accurate, detailed weather information based on
          user requests.', Handle any errors that occur gracefully and provide helpful guidance to the user.]

models:
  gemini-2.5-flash:
    type: literal
    agents: [root_agent]

tools:
  analyze_weather_trends:
    type: function
    agents: [root_agent]
    params:
      module: tools.analyze_weather_trends
      description: "Analyze weather trends for a city using functional programming.\n\nThis function demonstrates functional\
        \ programming concepts:\n- Pure functions\n- Higher-order functions\n- Function composition\n- Map, filter, reduce\
        \ operations\n- Immutability\n\nArgs:\n    city: City name\n    days: Number of days to analyze (1-5)\n    \nReturns:\n\
        \    Dictionary with weather trend analysis\n    \nRaises:\n    ValidationError: If parameters are invalid\n    WeatherAPIError:\
        \ If the API returns an error"
  get_forecast:
    type: function
    agents: [root_agent]
    params:
      module: tools.get_forecast
      description: "Get weather forecast for a city.\n\nArgs:\n    city: City name\n    days: Number of days to forecast (1-5)\n\
        \    \nReturns:\n    Dictionary with forecast data\n    \nRaises:\n    ValidationError: If parameters are invalid\n\
        \    WeatherAPIError: If the API returns an error\n    ConnectionError: If there's a network issue"
  get_weather:
    type: function
    agents: [root_agent]
    params:
      module: tools.get_weather
      description: "Get current weather for a city.\n\nArgs:\n    city: City name\n    \nReturns:\n    Dictionary with current\
        \ weather data\n    \nRaises:\n    ValidationError: If city parameter is invalid\n    WeatherAPIError: If the API\
        \ returns an error\n    ConnectionError: If there's a network issue"
  kelvin_to_celsius:
    type: function
    agents: [root_agent]
    params:
      module: tools.kelvin_to_celsius
      description: "Convert temperature from Kelvin to Celsius.\n\nArgs:\n    temperature: Temperature in Kelvin\n    \nReturns:\n\
        \    Dictionary with the converted temperature in Celsius\n    \nRaises:\n    ValidationError: If temperature parameter\
        \ is invalid"
  miles_to_km:
    type: function
    agents: [root_agent]
    params:
      module: tools.miles_to_km
      description: "Convert distance from miles to kilometers.\n\nArgs:\n    miles: Distance in miles\n    \nReturns:\n  \
        \  Dictionary with the converted distance in kilometers\n    \nRaises:\n    ValidationError: If miles parameter is\
        \ invalid"

imports:
  agent: agent
  Agent: google.adk.agents.Agent
  aiohttp: aiohttp
  Any: typing.Any
  asyncio: asyncio
  BASE_WEATHER_URL: config.BASE_WEATHER_URL
  Callable: typing.Callable
  datetime: datetime.datetime
  Dict: typing.Dict
  LANGUAGE: config.LANGUAGE
  List: typing.List
  logging: logging
  Optional: typing.Optional
  os: os
  partial: functools.partial
  reduce: functools.reduce
  tools: tools
  Tuple: typing.Tuple
  WEATHER_API_KEY: config.WEATHER_API_KEY

functions:
  __init__:
    type: sync
    module: weather_agent.tools
    args: [self, status_code, message]
  _make_api_call:
    type: async
    module: weather_agent.tools
    args: [endpoint, params]
    params:
      returns: Dict
  analyze_data:
    type: sync
    module: weather_agent.tools
    args: [data]
    params:
      returns: Dict
  analyze_weather_trends:
    type: async
    module: weather_agent.tools
    args: [city, days]
    params:
      returns: Dict
  average:
    type: sync
    module: weather_agent.tools
    args: [values]
    params:
      returns: float
  calculate_changes:
    type: sync
    module: weather_agent.tools
    args: [temps]
    params:
      returns: List[float]
  categorize_trend:
    type: sync
    module: weather_agent.tools
    args: [changes]
    params:
      returns: str
  condition_frequency:
    type: sync
    module: weather_agent.tools
    args: [data]
    params:
      returns: Dict
  dominant_condition:
    type: sync
    module: weather_agent.tools
    args: [condition_counts]
    params:
      returns: Tuple
  extract_temperatures:
    type: sync
    module: weather_agent.tools
    args: [data]
    params:
      returns: List[float]
  format_temp:
    type: sync
    module: weather_agent.tools
    args: [temp]
    params:
      returns: str
  get_forecast:
    type: async
    module: weather_agent.tools
    args: [city, days]
    params:
      returns: Dict
  get_weather:
    type: async
    module: weather_agent.tools
    args: [city]
    params:
      returns: Dict
  k_to_c:
    type: sync
    module: weather_agent.tools
    args: [temp]
    params:
      returns: float
  kelvin_to_celsius:
    type: sync
    module: weather_agent.tools
    args: [temperature]
    params:
      returns: Dict
  miles_to_km:
    type: sync
    module: weather_agent.tools
    args: [miles]
    params:
      returns: Dict
